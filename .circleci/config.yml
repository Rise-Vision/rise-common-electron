version: 2.1

jobs:
  "test":
    docker: &DOCKERIMAGE
      - image: cimg/node:22.17
    steps:
      - checkout
      - run: node --version && npm --version
      - run: npm install
      - run: npm run test
      - run: npm run integration

workflows:
  version: 2
  test_and_deploy:
    jobs:
      - "test"
